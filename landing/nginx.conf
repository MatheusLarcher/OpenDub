server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location /downloads/ {
        autoindex off;
        add_header Content-Disposition "attachment";
    }

    # Uma hora, com revalidacao. Antes eram 7 dias, e o Cloudflare honrava: uma imagem
    # trocada continuava velha na borda por dias, mesmo com o deploy correto no servidor.
    # As URLs dos assets tambem levam ?v=<hash do conteudo>, que resolve na hora; este
    # limite curto e a rede de seguranca para o que nao tem hash.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
